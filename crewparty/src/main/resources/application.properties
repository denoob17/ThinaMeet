server.port=${PORT:8080}
spring.application.name=crewparty

# Send the human-readable reason of a rejected request to the UI (e.g. "This party is already full.")
server.error.include-message=always

# Optional external services (both optional: the app runs fully offline without them)
openai.api.key=${OPENAI_API_KEY:}
stripe.secret.key=${STRIPE_SECRET_KEY:}
